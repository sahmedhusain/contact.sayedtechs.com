<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- Browser & OS Color Themes -->
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0A0A0A">

  <!-- Primary Meta Tags -->
  <title>Mr. Tech | سيد التقنية - Social Links Directory</title>
  <meta name="title" content="Mr. Tech | سيد التقنية - Social Links Directory">
  <meta name="description"
    content="Official social accounts for Mr. Tech / سيد التقنية (@sayedtechs) - Technology, Engineering, Gaming, AI, Automotive, and Electronics. / الحسابات الرسمية لسيد التقنية.">
  <meta name="keywords"
    content="SayedTech, Mr. Tech, سيد التقنية, sayedtechs, Snapchat, Facebook, Instagram, X, TikTok, YouTube, Bahrain, GCC, Tech Influencer">
  <meta name="author" content="SayedTech">

  <!-- App Capabilities -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SayedTech">

  <!-- Format Detection -->
  <meta name="format-detection" content="telephone=no">
  <meta name="format-detection" content="date=no">
  <meta name="format-detection" content="address=no">
  <meta name="format-detection" content="email=no">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SayedTech Social Links">
  <meta property="og:title" content="Mr. Tech | سيد التقنية - Social Links Directory">
  <meta property="og:description"
    content="Connect with Mr. Tech (@sayedtechs) across all official platforms. Technology, Engineering, Gaming, AI, Automotive, and Electronics.">
  <meta property="og:image" content="SayedTech-Logo-System/Social-Media/instagram-profile.png">
  <meta property="og:image:width" content="500">
  <meta property="og:image:height" content="500">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Mr. Tech | سيد التقنية - Social Links Directory">
  <meta name="twitter:description"
    content="Connect with Mr. Tech (@sayedtechs) across all official platforms.">
  <meta name="twitter:image" content="SayedTech-Logo-System/Social-Media/twitter-profile.png">

  <!-- Dynamic Language Title Sync -->
  <script>
    (function () {
      var lang = 'en';
      try { lang = localStorage.getItem('lang') || 'en'; } catch (e) { lang = 'en'; }
      
      var titles = {
        en: "Mr. Tech | سيد التقنية - Social Links Directory",
        ar: "سيد التقنية | Mr. Tech - دليل الحسابات الرسمية"
      };
      var descriptions = {
        en: "Official social accounts for Mr. Tech / سيد التقنية (@sayedtechs) - Technology, Engineering, Gaming, AI, Automotive, and Electronics.",
        ar: "الدليل الرسمي لحسابات سيد التقنية (@sayedtechs) على منصات التواصل الاجتماعي. تكنولوجيا، هندسة، ألعاب، ذكاء اصطناعي، سيارات وإلكترونيات."
      };
      document.title = titles[lang] || titles.en;
      var metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', descriptions[lang] || descriptions.en);
    })();
  </script>

  <!-- Favicons & Manifest -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon-256.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
  <link rel="manifest" href="site.webmanifest" id="manifest-link">

  <!-- Fonts & Icons Preloads -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for Social Brand Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- IonIcons for UI Icons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <script>
    (function () {
      var basePath = '/';
      var theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);

      function injectAsset(file, type) {
        var path = (basePath + '/' + file).replace(/\/+/g, '/');
        var absoluteUrl = window.location.origin + path;
        var el;
        if (type === 'css') {
          el = document.createElement('link');
          el.rel = 'stylesheet';
          el.href = absoluteUrl;
        } else {
          el = document.createElement('script');
          el.type = 'module';
          el.src = absoluteUrl;
        }
        document.head.appendChild(el);
      }

      // Inject Entry Point CSS
      injectAsset('src/css/main.css', 'css');

      // Inject Entry Point JavaScript
      function startApp() { injectAsset('main.js', 'js'); }
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', startApp);
      } else {
        startApp();
      }
    })();
  </script>
</head>

<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="glow-bubble glow-bubble-teal ambient-glow-1"></div>
    <div class="glow-bubble glow-bubble-gold ambient-glow-2"></div>
    <div class="glow-bubble glow-bubble-midnight"></div>
  </div>

  <!-- App Mounting Shell -->
  <div id="app" class="social-portal-layout">
    <!-- Portal content loaded dynamically by main.js -->
  </div>
</body>

</html>
